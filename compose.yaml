services:
  database:
    container_name: 'postgres-dev'
    image: 'postgres:16.0-alpine3.18'
    env_file:
      - .env.development
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: 'redis-dev'
    image: 'redis:7.2-alpine'
    env_file:
      - .env.development
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
